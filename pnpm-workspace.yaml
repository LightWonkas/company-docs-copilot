allowBuilds:
  sharp: false
  unrs-resolver: false
  # The Supabase CLI package downloads its Go binary in postinstall.
  supabase: true
  # CPU binaries ship in the package; postinstall only fetches optional CUDA builds.
  onnxruntime-node: false
  protobufjs: false
  esbuild: false
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.119.2'
  - '@supabase/functions-js@2.119.2'
  - '@supabase/postgrest-js@2.119.2'
  - '@supabase/realtime-js@2.119.2'
  - '@supabase/storage-js@2.119.2'
  - '@supabase/supabase-js@2.119.2'
  - '@anthropic-ai/sdk@1.11.0'
